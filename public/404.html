<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>404</title>
    <script>
        (function () {
            var path = location.pathname + location.search + location.hash;
            // project base used by the app
            var project = '/kush-n-cozzy';
            var redirectTo = project + '/?p=' + encodeURIComponent(path);
            location.replace(redirectTo);
        })();
    </script>
</head>

<body></body>

</html>
